name: Collect land opportunities

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC (about 5 am Eastern)
  workflow_dispatch:
    inputs:
      base:
        description: "Home base id (ashford-ct, ashford-wa, ashford-al, ashford-ny, ashford-wv, ashford-kent)"
        default: "ashford-ct"
      radius:
        description: "Search radius in miles"
        default: "100"
      min_acres:
        description: "Minimum acres"
        default: "5"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - name: Install collector
        working-directory: collector
        run: npm ci
      - name: Run collector
        working-directory: collector
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COLLECTOR_BASE: ${{ github.event.inputs.base || 'ashford-ct' }}
          COLLECTOR_RADIUS: ${{ github.event.inputs.radius || '100' }}
          COLLECTOR_MIN_ACRES: ${{ github.event.inputs.min_acres || '5' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret not set; running heuristic extraction only"
            node run.js --no-llm
          else
            node run.js
          fi
      - name: Commit results
        run: |
          git config user.name "land-collector[bot]"
          git config user.email "land-collector@users.noreply.github.com"
          git add data/found-parcels.js data/found-parcels.json collector/last-run.json collector/cache/geocode.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Collector: update found parcels ($(date -u +%Y-%m-%d))"
            git push
          fi
